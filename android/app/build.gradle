plugins {
    id "com.android.application"
}

def webAssets = file("$buildDir/generated/web-assets")

tasks.register("syncWebAssets", Sync) {
    from(rootProject.projectDir.parentFile) {
        include "index.html"
        include "styles.css"
        include "runtime.bundle.js"
        include "BUILD_ID"
    }
    into(new File(webAssets, "www"))
}

android {
    namespace "studio.tabletennis.robot"
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "studio.tabletennis.robot"
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName "2026-10-10.11"
    }

    sourceSets {
        main.assets.srcDir(webAssets)
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named("preBuild").configure {
    dependsOn("syncWebAssets")
}

dependencies {
    implementation "androidx.core:core:1.17.0"
    implementation "androidx.webkit:webkit:1.14.0"
}
